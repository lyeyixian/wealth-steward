server {
    listen 80;
    server_name _;

    # Liveness probe — resolves whenever the container is up (static response,
    # no upstream dependency). The web tier has nothing to reach for issue #2.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
